    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>input {width: 2em;text-align: center;} button {}</style>
    </head>
    <body>
        <input type="text">
        <input type="text">
        <input type="text">
        <input type="text">
        <input type="text">
        <input type="text">
        <button disabled>전송하기</button>
        <script>
            const inputs = document.querySelectorAll('input')
            const button = document.querySelector('button')

            inputs.forEach((input, i) => {
                input.oninput = () => {
                    input.value = input.value.replace(/[^0-9]/, '')
                    if (input.value.length > 1) input.value = input.value[0]
                    if (input.value && i != 5) inputs[i + 1].focus()
                    checkAll()
                }

                input.onkeydown = (e) => {
                    if (e.key != 'Backspace') return
                    if (i != 0 && !input.value) inputs[i - 1].focus()
                }
            })

            function checkAll() {button.disabled = [...inputs].every(input => input.value) ?  false : true}
        </script>
    </body>
    </html>
