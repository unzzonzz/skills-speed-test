<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="file">
    <img src="" alt="">
    <button>흑백</button>
    <button>세피아</button>
    <button>반전</button>
    <button>원본</button>
    <script>
        const input = document.querySelector('input')
        const img = document.querySelector('img')
        const button = document.querySelectorAll('button')
        input.addEventListener('input', (e) => {
            img.src = URL.createObjectURL(e.target.files[0])
        })
        button[0].onclick = () => img.style.filter = 'grayscale(100%)'
        button[1].onclick = () => img.style.filter = 'sepia(100%)'
        button[2].onclick = () => img.style.filter = 'invert(100%)'
        button[3].onclick = () => img.style.filter = 'none'
    </script>
</body>
</html>
