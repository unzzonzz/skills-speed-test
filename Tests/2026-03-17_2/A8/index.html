<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="content-1">
        <div class="content-2"><h2>장바구니</h2></div>
        <div class="content-3">
            <div class="content-4">
                <div class="content-5">
                    <img src="./images/tshirt.jpg" alt="">
                    <div class="content-6">
                        <span class="text-1">WorldSkills 공식 티셔츠</span>
                        <span class="text-2">색상: 네이비</span>
                        <span class="text-3">사이즈: L</span>
                    </div>
                </div>
                <div class="content-61">
                    <div class="content-7">
                        <div class="button">-</div>
                        <div class="count">2</div>
                        <div class="button">+</div>
                    </div>
                    <h3>25,000원</h3>
                    <div class="close">×</div>
                </div>
            </div>
            <div class="content-4">
                <div class="content-5">
                    <img src="./images/book.jpg" alt="">
                    <div class="content-6">
                        <span class="text-1">기능경기 가이드북</span>
                        <span class="text-2">종류: 웹디자인</span>
                        <span class="text-3">2026년 최신판</span>
                    </div>
                </div>
                <div class="content-61">
                    <div class="content-7">
                        <div class="button">-</div>
                        <div class="count">1</div>
                        <div class="button">+</div>
                    </div>
                    <h3>15,000원</h3>
                    <div class="close">×</div>
                </div>
            </div>
            <div class="content-4">
                <div class="content-5">
                    <img src="./images/laptop-case.jpg" alt="">
                    <div class="content-6">
                        <span class="text-1">WorldSkills 노트북 파우치</span>
                        <span class="text-2">색상: 블랙</span>
                        <span class="text-3">15인치 호환</span>
                    </div>
                </div>
                <div class="content-61">
                    <div class="content-7">
                        <div class="button">-</div>
                        <div class="count">1</div>
                        <div class="button">+</div>
                    </div>
                    <h3>35,000원</h3>
                    <div class="close">×</div>
                </div>
            </div>
        </div>
        <div class="content-8">
            <div class="content-9">
                <span class="text-1">상품금액</span>
                <span class="text-2">75,000원</span>
            </div>
            <div class="content-9">
                <span class="text-1">배송비</span>
                <span class="text-2">3,000원</span>
            </div>
            <div class="content-10">
                <span class="text-1">총 결제금액</span>
                <span class="text-2">78,000원</span>
            </div>
        </div>
        <div class="content-11">
            <div class="button">쇼핑 계속하기</div>
            <div class="button">주문하기</div>
        </div>
    </div>
</body>
</html>
