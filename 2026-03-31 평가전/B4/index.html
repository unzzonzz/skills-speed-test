<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1></h1>
  <script>
    setInterval(() => { 
      let date = String(new Date)
      document.querySelector('h1').textContent = date.slice(16, 24)
    }, 1)
  </script>
</body>
</html>
